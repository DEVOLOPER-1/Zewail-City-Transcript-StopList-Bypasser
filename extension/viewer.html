<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zewail-City-Transcript-StopList-Bypasser</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
      color: #1f2937;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }
    .hero {
      background: linear-gradient(135deg, #0f62fe, #0b3d91);
      color: white;
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 30px rgba(15, 98, 254, 0.18);
    }
    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      font-size: 14px;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 18px;
    }
    .action-btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: #0f62fe;
      color: white;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 98, 254, 0.2);
    }
    .action-btn:hover { background: #0b4fd3; }
    .card, .semester-card, .org-card {
      background: white;
      border: 1px solid #d7dde8;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(31, 41, 55, 0.06);
    }
    .card { padding: 14px; }
    .label { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: .06em; }
    .value { margin-top: 6px; font-size: 18px; font-weight: 700; }
    .semester-card { padding: 16px; margin-bottom: 16px; }
    .org-card { padding: 12px; margin-top: 12px; }
    .org-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
    th { background: #e8f0fe; }
    .muted { color: #6b7280; }
    .error { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; padding: 12px; border-radius: 12px; }
  </style>
  <script src="viewer.js" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>Zewail-City-Transcript-StopList-Bypasser</h1>
      <div>Transcript viewer</div>
      <div id="status" class="status">Loading…</div>
    </div>

    <div id="content"></div>
  </div>
</body>
</html>
